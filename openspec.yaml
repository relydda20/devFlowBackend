openapi: 3.0.0
info:
  title: DevFlow AI API
  description: AI-powered workflow intelligence for agentic development
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

components:
  schemas:
    FileTelemetryMetadata:
      type: object
      required:
        - path
      properties:
        name: { type: string }
        path: { type: string }
        absolute_path: { type: string }
        extension: { type: string }
        language: { type: string }
        workspace: { type: string }
        lines: { type: integer }
        size_bytes: { type: integer }

    BaseTelemetryEvent:
      type: object
      required:
        - type
        - timestamp
        - workspace
        - session_id
      properties:
        type:
          type: string
          enum:
            - file_save
            - text_change
            - editor_switch
            - debug_session_start
            - terminal_open
            - git_activity
        timestamp:
          type: string
          format: date-time
        workspace:
          type: string
        session_id:
          type: string
          format: uuid

    TelemetryEvent:
      oneOf:
        - $ref: '#/components/schemas/FileSaveTelemetryEvent'
        - $ref: '#/components/schemas/TextChangeTelemetryEvent'
        - $ref: '#/components/schemas/EditorSwitchTelemetryEvent'
        - $ref: '#/components/schemas/DebugSessionTelemetryEvent'
        - $ref: '#/components/schemas/TerminalTelemetryEvent'
        - $ref: '#/components/schemas/GitActivityTelemetryEvent'

    FileSaveTelemetryEvent:
      allOf:
        - $ref: '#/components/schemas/BaseTelemetryEvent'
        - type: object
          required: [file]
          properties:
            type: { type: string, enum: [file_save] }
            file: { $ref: '#/components/schemas/FileTelemetryMetadata' }

    TextChangeTelemetryEvent:
      allOf:
        - $ref: '#/components/schemas/BaseTelemetryEvent'
        - type: object
          required: [file, metrics]
          properties:
            type: { type: string, enum: [text_change] }
            file: { $ref: '#/components/schemas/FileTelemetryMetadata' }
            metrics:
              type: object
              required:
                - characters_added
                - characters_deleted
                - change_count
                - edit_duration_ms
                - is_large_paste
                - is_possible_rewrite
                - is_possible_undo_cycle
              properties:
                characters_added: { type: integer }
                characters_deleted: { type: integer }
                change_count: { type: integer }
                affected_line_ranges:
                  type: array
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start: { type: integer }
                      end: { type: integer }
                edit_duration_ms: { type: integer }
                is_large_paste: { type: boolean }
                is_possible_rewrite: { type: boolean }
                is_possible_undo_cycle: { type: boolean }

    EditorSwitchTelemetryEvent:
      allOf:
        - $ref: '#/components/schemas/BaseTelemetryEvent'
        - type: object
          required: [metrics]
          properties:
            type: { type: string, enum: [editor_switch] }
            from:
              type: object
              properties:
                file: { type: string }
                language: { type: string }
                module: { type: string }
            to:
              type: object
              properties:
                file: { type: string }
                language: { type: string }
                module: { type: string }
            metrics:
              type: object
              required:
                - switch_interval_seconds
                - is_cross_module_switch
                - is_rapid_context_switching
              properties:
                switch_interval_seconds: { type: number }
                is_cross_module_switch: { type: boolean }
                is_rapid_context_switching: { type: boolean }

    DebugSessionTelemetryEvent:
      allOf:
        - $ref: '#/components/schemas/BaseTelemetryEvent'
        - type: object
          required: [debug]
          properties:
            type: { type: string, enum: [debug_session_start] }
            debug:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string }
                launch_configuration_name: { type: string }

    TerminalTelemetryEvent:
      allOf:
        - $ref: '#/components/schemas/BaseTelemetryEvent'
        - type: object
          required: [terminal]
          properties:
            type: { type: string, enum: [terminal_open] }
            terminal:
              type: object
              required: [name]
              properties:
                name: { type: string }
                shell_type: { type: string }

    GitActivityTelemetryEvent:
      allOf:
        - $ref: '#/components/schemas/BaseTelemetryEvent'
        - type: object
          required: [git]
          properties:
            type: { type: string, enum: [git_activity] }
            git:
              type: object
              required: [changed_files_count]
              properties:
                branch: { type: string }
                changed_files_count: { type: integer }

    TelemetryPayload:
      type: object
      required:
        - workspace
        - machine_timestamp
        - session
        - events
      properties:
        workspace:
          type: string
        machine_timestamp:
          type: string
          format: date-time
        session:
          type: object
          required:
            - active_minutes
            - idle_minutes
            - total_events_collected
            - save_frequency
            - editor_switch_frequency
          properties:
            active_minutes: { type: number }
            idle_minutes: { type: number }
            total_events_collected: { type: integer }
            save_frequency: { type: number }
            editor_switch_frequency: { type: number }
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TelemetryEvent'

    IssueTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    IssueTokenResponse:
      type: object
      required: [id, name, token, token_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token: { type: string }
        token_prefix: { type: string }
        created_at: { type: string, format: date-time }

    ApiTokenSummary:
      type: object
      required: [id, name, token_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token_prefix: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }

    TokenListResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/ApiTokenSummary'

    WorkflowState:
      type: object
      required:
        - state_type
        - confidence
        - created_at
      properties:
        state_type:
          type: string
          enum:
            - stuck_loop
            - lost_in_codebase
            - ai_dependency_trap
            - integration_hell
            - analysis_paralysis
            - normal
        confidence:
          type: number
          minimum: 0
          maximum: 1
        duration_minutes:
          type: integer
        created_at:
          type: string
          format: date-time

    Recommendation:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - change_approach
            - map_system
            - stop_using_ai
            - simplify_problem
            - execute
        text:
          type: string
        code_context:
          type: object
          properties:
            file_path:
              type: string
            recent_errors:
              type: array
              items:
                type: string

    SignalResponse:
      type: object
      required:
        - state
        - metrics
      properties:
        state:
          $ref: '#/components/schemas/WorkflowState'
        recommendation:
          $ref: '#/components/schemas/Recommendation'
        metrics:
          type: object
          required:
            - code_churn_score
            - context_switching_score
            - ai_iteration_score
          properties:
            code_churn_score:
              type: number
              minimum: 0
              maximum: 10
            context_switching_score:
              type: number
              minimum: 0
              maximum: 10
            ai_iteration_score:
              type: number
              minimum: 0
              maximum: 10

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        username:
          type: string
          minLength: 3
          maxLength: 50

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required:
        - user
        - token
      properties:
        user:
          type: object
          required: [id, username, provider]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            email:
              type: string
              nullable: true
            provider:
              type: string
              enum: [google, github, password]
        token:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

paths:
  /telemetry:
    post:
      summary: Submit a TelemetryPayload from the DevVital AI extension
      operationId: submitTelemetry
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPayload'
      responses:
        '202':
          description: Telemetry accepted for processing
          content:
            application/json:
              schema:
                type: object
                required: [message, accepted_count]
                properties:
                  message: { type: string }
                  accepted_count: { type: integer }
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Session ownership conflict

  /auth/tokens:
    post:
      summary: Mint a long-lived API token for the authenticated user
      operationId: issueApiToken
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '201':
          description: Token issued (returned once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenResponse'
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: API tokens cannot mint tokens
    get:
      summary: List the caller's API tokens
      operationId: listApiTokens
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Tokens (hash and plaintext never returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
        '401':
          description: Unauthorized
        '403':
          description: API tokens cannot list tokens

  /auth/tokens/{id}:
    delete:
      summary: Revoke an API token owned by the caller
      operationId: revokeApiToken
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
        '401':
          description: Unauthorized
        '403':
          description: API tokens cannot revoke tokens
        '404':
          description: Not found

  /signals/current:
    get:
      summary: Get current workflow signals for a user
      operationId: getCurrentSignals
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current workflow state and metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '404':
          description: No active session found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  uptime:
                    type: number

  /auth/{provider}:
    get:
      summary: Start OAuth flow for a provider (google or github)
      operationId: startOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: client_type
          in: query
          required: false
          schema:
            type: string
            enum: [web, vscode]
            default: web
      responses:
        '302':
          description: Redirect to provider authorization URL
        '400':
          description: Unsupported provider

  /auth/{provider}/callback:
    get:
      summary: OAuth callback — completes the flow, issues JWT
      operationId: oauthCallback
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Web → redirect to WEB_APP_URL with session cookie; vscode → redirect to deep link with token
        '400':
          description: Invalid state, unsupported provider, or provider error

  /auth/me:
    get:
      summary: Get the currently authenticated user
      operationId: getMe
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                required: [id, username, provider]
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  email:
                    type: string
                    nullable: true
                  provider:
                    type: string
                    enum: [google, github]
        '401':
          description: Authentication required

  /auth/logout:
    post:
      summary: Clear the session cookie
      operationId: logout
      responses:
        '204':
          description: Cookie cleared

  /auth/register:
    post:
      summary: Register a new user with email + password
      operationId: registerPasswordUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; cookie set and token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Log in with email + password
      operationId: loginPasswordUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
